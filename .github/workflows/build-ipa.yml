name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and generate IPA
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ./DragonCityClient
        run: xcodegen generate

      - name: Build iOS App
        working-directory: ./DragonCityClient
        run: |
          xcodebuild -project DragonCityClient.xcodeproj \
                     -scheme DragonCityClient \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=\$(find DragonCityClient/build -name "DragonCityClient.app" -type d | head -n 1)
          if [ -d "\$APP_PATH" ]; then
            cp -r "\$APP_PATH" Payload/
            zip -r DragonCityClient.ipa Payload/
            ls -la DragonCityClient.ipa
          else
            echo "App not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonCityClient-IPA
          path: DragonCityClient.ipa
